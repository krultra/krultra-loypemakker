<!DOCTYPE html>
<!--
  Innbyggbar løypevisning — publiseres av KrUltra Løypemakker.
  Denne fila er en MAL: ved publisering byttes __V__ ut med gjeldende
  asset-versjon, og fila legges i løypas mappe sammen med course.json.
  All logikk ligger i delte assets (../assets/v<N>/), så en løype-mappe
  består kun av denne lille fila + course.json.
-->
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Løypekart</title>
  <link rel="icon" type="image/png" href="../assets/v__V__/favicon.png">
  <link rel="stylesheet" href="../assets/v__V__/leaflet.css">
  <link rel="stylesheet" href="../assets/v__V__/viewer.css">
  <link rel="stylesheet" href="../assets/v__V__/flyby.css">
</head>
<body>

  <header id="topp" class="skjult">
    <div id="topp-tekst">
      <h1 id="tittel"></h1>
      <p id="beskrivelse"></p>
      <p id="nokkeltall"></p>
    </div>
    <!-- Knappene står utenfor kartet så de ikke stjeler kartflate -->
    <div id="topp-knapper">
      <button id="lag-knapp" title="Bytt mellom kart og satellittbilde">Satellitt</button>
      <!-- 3D fly-by: simulert gjennomkjøring av løypa (vises når løypa er
           lastet, og bare når nettleseren støtter 3D-kart) -->
      <button id="flyby-knapp" class="skjult"
              title="Spill av en gjennomkjøring av løypa i 3D-terreng">▶ Flyover</button>
      <!-- Lenke til en publisert flyover-video (vises bare når løypa har en).
           Åpnes i samme vindu, så videoen vises i iframen når visningen er
           bygd inn — på samme måte som flyoveren selv. -->
      <a id="video-lenke" class="skjult"
         title="Se flyover-videoen av løypa">🎬 Video</a>
      <!-- Last ned løypa som GPX-fil (vises når løypedataene er lastet) -->
      <button id="last-ned-gpx" class="skjult"
              title="Last ned løypa som GPX-fil">⤓ GPX</button>
      <!-- Vises bare når visningen er bygd inn i en annen side (iframe) -->
      <button id="fullskjerm-knapp" class="skjult"
              title="Åpne løypevisningen i egen fane i full størrelse">⛶ Full skjerm</button>
    </div>
  </header>

  <div id="map">
    <!-- Hint på berøringsskjermer i iframe: én finger scroller siden -->
    <div id="kart-hint" class="skjult">Bruk to fingre for å flytte kartet</div>
  </div>

  <div id="kontroll">
    <input type="range" id="slider" min="0" max="0" value="0"
           aria-label="Flytt markøren langs løypa">
    <div id="info" class="skjult">
      <div class="info-celle"><span class="info-navn" id="i-lbl-dist">Distanse</span><span id="i-dist" class="info-verdi"></span></div>
      <div class="info-celle"><span class="info-navn" id="i-forrige-navn">Fra forrige punkt</span><span id="i-dist-forrige" class="info-verdi"></span></div>
      <div class="info-celle"><span class="info-navn" id="i-lbl-hoyde">Høyde</span><span id="i-hoyde" class="info-verdi"></span></div>
      <div class="info-celle"><span class="info-navn" id="i-lbl-hm-start">Høydemeter fra start</span><span id="i-hm-start" class="info-verdi"></span></div>
      <div class="info-celle"><span class="info-navn" id="i-lbl-hm-forrige">Fra forrige punkt</span><span id="i-hm-forrige" class="info-verdi"></span></div>
    </div>
  </div>

  <div id="profil-wrap">
    <canvas id="profil"></canvas>
  </div>

  <footer id="bunn"></footer>

  <div id="laster">Laster løypa …</div>

  <script src="../assets/v__V__/leaflet.js"></script>
  <script src="../assets/v__V__/felles.js"></script>
  <!-- Liten modul; selve 3D-biblioteket (maplibre) lastes først når
       brukeren faktisk åpner en fly-by -->
  <script src="../assets/v__V__/flyby.js"></script>
  <script src="../assets/v__V__/viewer.js"></script>
</body>
</html>
